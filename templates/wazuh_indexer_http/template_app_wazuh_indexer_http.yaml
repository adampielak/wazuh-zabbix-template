zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: 'Templates/Applications'
  templates:
    - uuid: '1b28bd8ccc6e4ddaba1b6e0033894960'
      template: 'Wazuh indexer by HTTP'
      name: 'Wazuh indexer by HTTP'
      description: |
        Monitors the Wazuh indexer (OpenSearch) cluster through its REST API: cluster health, shard allocation and limits, disk watermarks, per-node JVM heap, disk, CPU, file descriptors, thread pool rejections, circuit breakers, and the ingest of Wazuh alerts.

        Setup:

        1. Create an indexer user for monitoring. It needs the cluster permission cluster_monitor and the index permission indices:data/read/search on the alerts index pattern (wazuh-alerts-* by default). The README in the repository root has an example role.
        2. Link the template to a host and set {$WAZUH.INDEXER.HOST} to one indexer node, or to a load balancer in front of the cluster. All cluster data is collected through this node, so link the template to one host per cluster.
        3. Set {$WAZUH.INDEXER.USER} and {$WAZUH.INDEXER.PASSWORD}.

        The Wazuh indexer uses https on port 9200 by default. Certificates are not verified: the HTTP agent items do not set "verify_peer" and "verify_host".

        Tested with Wazuh indexer 4.14 (OpenSearch 2.19) and Zabbix 7.0.

        Created by Adam "tick" Pielak, https://wazuh.blog
      vendor:
        name: 'Adam "tick" Pielak'
        version: '7.0-1'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: cf1e03932847480fa563bdf3a8914a20
          name: 'Service status'
          type: SIMPLE
          key: 'net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"]'
          description: 'Checks if the indexer port is accepting TCP connections.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '10m'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: '18b7d08b54bd4566ac781efa50c21888'
              expression: 'last(/Wazuh indexer by HTTP/net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"])=0'
              name: 'Wazuh indexer: Service is down'
              priority: AVERAGE
              description: 'The indexer port is not accepting TCP connections.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: aef3e14b5752460f8817b6688e587232
          name: 'Service response time'
          type: SIMPLE
          key: 'net.tcp.service.perf["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"]'
          value_type: FLOAT
          units: s
          description: 'Checks the performance of the TCP service.'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: '9c6f3bac5caf44b7996f63b6bb6d1d91'
              expression: 'min(/Wazuh indexer by HTTP/net.tcp.service.perf["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"],5m)>{$WAZUH.INDEXER.RESPONSE_TIME.MAX.WARN}'
              name: 'Wazuh indexer: Service response time is too high'
              event_name: 'Wazuh indexer: Service response time is too high (over {$WAZUH.INDEXER.RESPONSE_TIME.MAX.WARN} for 5m)'
              priority: WARNING
              description: 'The TCP service of the indexer responds slowly.'
              manual_close: 'YES'
              dependencies:
                - name: 'Wazuh indexer: Service is down'
                  expression: 'last(/Wazuh indexer by HTTP/net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"])=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: fba7b72a2958444faf4693eedf541de4
          name: 'Get cluster health'
          type: HTTP_AGENT
          key: wazuh.indexer.cluster.get_health
          delay: '1m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_cluster/health?timeout=5s'
          description: 'Returns the health of the cluster.'
          tags:
            - tag: component
              value: raw
        - uuid: b638b79f6f83479385a470a891c3203d
          name: 'Get cluster settings'
          type: HTTP_AGENT
          key: wazuh.indexer.cluster.get_settings
          delay: '1h'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_cluster/settings?include_defaults=true&filter_path=*.cluster.max_shards_per_node,*.cluster.routing.allocation.disk.watermark'
          description: 'Returns the shard limit and the disk watermarks (transient, persistent and default values).'
          tags:
            - tag: component
              value: raw
        - uuid: '43b4e50379c44d85895b8262905045dc'
          name: 'Get nodes stats'
          type: HTTP_AGENT
          key: wazuh.indexer.nodes.get_stats
          delay: '1m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '30s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_nodes/stats/jvm,fs,os,process,thread_pool,breaker?filter_path=nodes.*.name,nodes.*.roles,nodes.*.jvm.mem.heap_used_percent,nodes.*.jvm.uptime_in_millis,nodes.*.fs.total,nodes.*.os.cpu.percent,nodes.*.process.open_file_descriptors,nodes.*.process.max_file_descriptors,nodes.*.thread_pool.write.rejected,nodes.*.thread_pool.search.rejected,nodes.*.breakers.parent.tripped'
          description: 'Returns statistics of all cluster nodes.'
          tags:
            - tag: component
              value: raw
        - uuid: '6b3b6d7e29ca4b2a8b3bc6b2a0997e85'
          name: 'Get nodes info'
          type: HTTP_AGENT
          key: wazuh.indexer.nodes.get_info
          delay: '1h'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_nodes?filter_path=nodes.*.name,nodes.*.version'
          description: 'Returns the name and version of all cluster nodes.'
          tags:
            - tag: component
              value: raw
        - uuid: '5cd6220053904a1396edc369187b1c81'
          name: 'Get alerts ingest'
          type: HTTP_AGENT
          key: wazuh.indexer.alerts.get
          delay: '5m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/{$WAZUH.INDEXER.ALERTS.INDEX}/_search?size=0&filter_path=hits.total,aggregations'
          request_method: POST
          post_type: JSON
          posts: '{"track_total_hits":true,"query":{"range":{"timestamp":{"gte":"now-{$WAZUH.INDEXER.ALERTS.WINDOW}"}}},"aggs":{"last":{"max":{"field":"timestamp"}}}}'
          description: 'Counts the alerts indexed in the last {$WAZUH.INDEXER.ALERTS.WINDOW} and returns the newest alert timestamp.'
          tags:
            - tag: component
              value: raw
        - uuid: '5bd4f69763a044c09268fc925693c7a9'
          name: 'Cluster health status'
          type: DEPENDENT
          key: wazuh.indexer.cluster.status
          delay: '0'
          description: 'Health of the cluster: green - all shards are assigned, yellow - all primary shards are assigned but one or more replicas are not, red - one or more primary shards are not assigned.'
          valuemap:
            name: 'Wazuh indexer cluster state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.status'
            - type: JAVASCRIPT
              parameters:
                - |
                  var state = ['green', 'yellow', 'red'];

                  return state.indexOf(value.trim()) === -1 ? 255 : state.indexOf(value.trim());
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: a5aee9c91fdb4015b9a1d60fbce43ede
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.cluster.status)=2'
              name: 'Wazuh indexer: Health is RED'
              priority: HIGH
              description: 'One or more primary shards are unassigned. Some data is unavailable and new alerts for the affected indices are not indexed.'
              tags:
                - tag: scope
                  value: availability
            - uuid: a5dba0c1139a45148a09738aa456a259
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.cluster.status)=1'
              name: 'Wazuh indexer: Health is YELLOW'
              priority: AVERAGE
              description: 'All primary shards are assigned, but one or more replica shards are not. If a node fails, some data can be unavailable until the node is repaired.'
              tags:
                - tag: scope
                  value: availability
            - uuid: d8fd5374e502471da0538f8b4e173db8
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.cluster.status)=255'
              name: 'Wazuh indexer: Health is UNKNOWN'
              priority: HIGH
              description: 'The health of the cluster is unknown or cannot be read.'
              tags:
                - tag: scope
                  value: availability
        - uuid: fb03f288ab2f475a9e8a7b5ab44c22b7
          name: 'Cluster name'
          type: DEPENDENT
          key: wazuh.indexer.cluster.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of the cluster.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster_name'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
        - uuid: baca87da35bb46e2a11315dd8d5acf49
          name: 'Number of nodes'
          type: DEPENDENT
          key: wazuh.indexer.nodes.number
          delay: '0'
          description: 'Nodes in the cluster.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_nodes'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: eceb7d7a35964143990819197bde9b4d
              expression: 'change(/Wazuh indexer by HTTP/wazuh.indexer.nodes.number)<0'
              name: 'Wazuh indexer: Number of nodes has decreased'
              priority: WARNING
              description: 'One or more nodes left the cluster.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: '3cd9d29b08fe4e85a5d20a39f493983c'
          name: 'Number of data nodes'
          type: DEPENDENT
          key: wazuh.indexer.nodes.data
          delay: '0'
          description: 'Data nodes in the cluster.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_data_nodes'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
        - uuid: '9f08f37aeb5049ee8c9c1ee0d3766f39'
          name: 'Active primary shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.primary
          delay: '0'
          description: 'Active primary shards.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.active_primary_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: da64da726cef40ba958ef301e9bbe705
          name: 'Active shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.active
          delay: '0'
          description: 'Active primary and replica shards.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.active_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: '875fa2b8fc0c4f668f8dfe134c87f047'
          name: 'Relocating shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.relocating
          delay: '0'
          description: 'Shards that are moving to another node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.relocating_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: '2638661dcc4a4ce5b25c9d386743823a'
          name: 'Initializing shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.initializing
          delay: '0'
          description: 'Shards that are being initialized.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.initializing_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: c63075122c614cd0ab69da8fe4f6e57f
          name: 'Unassigned shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.unassigned
          delay: '0'
          description: 'Shards that are not allocated to a node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unassigned_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: c208b50ff0d547e9bfe2d39e31df5734
          name: 'Delayed unassigned shards'
          type: DEPENDENT
          key: wazuh.indexer.shards.delayed_unassigned
          delay: '0'
          description: 'Shards whose allocation is delayed by the timeout settings.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.delayed_unassigned_shards'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: f87088c38c574bcaa43f2144f66dcdc5
          name: 'Active shards, in %'
          type: DEPENDENT
          key: wazuh.indexer.shards.active.pct
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Ratio of active shards to all shards.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.active_shards_percent_as_number'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: shards
        - uuid: '5dc75a4b899d4d28b86f00155e0e00be'
          name: 'Pending tasks'
          type: DEPENDENT
          key: wazuh.indexer.cluster.pending_tasks
          delay: '0'
          description: 'Cluster-level changes that are not yet executed.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_pending_tasks'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
        - uuid: b4e28aa67a90443eafaecd6eca821925
          name: 'Max shards per node'
          type: DEPENDENT
          key: wazuh.indexer.max_shards_per_node
          delay: '0'
          description: 'Effective value of cluster.max_shards_per_node.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.max_shards_per_node'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.max_shards_per_node is not set.';
                  }

                  return parseInt(value, 10);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: shards
        - uuid: '0d91e00b951f473fbcf0748614f8644e'
          name: 'Disk watermark low'
          type: DEPENDENT
          key: wazuh.indexer.watermark.low
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Effective value of cluster.routing.allocation.disk.watermark.low, in % of used disk space. -1 when the watermark is an absolute value. Above the low watermark OpenSearch stops allocating new shards to the node.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.routing.allocation.disk.watermark.low'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.routing.allocation.disk.watermark.low is not set.';
                  }

                  // A watermark is a percentage ("85%"), a ratio ("0.85") or an absolute free space ("10gb").
                  // Absolute values are returned as -1: the disk triggers use only relative watermarks.
                  if (/^\d+(\.\d+)?%$/.test(value)) {
                  	return parseFloat(value);
                  }
                  if (/^0?\.\d+$|^1(\.0+)?$/.test(value)) {
                  	return parseFloat(value) * 100;
                  }

                  return -1;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: storage
        - uuid: '29ef0dc4305140ac85bf4e15e8a5edf3'
          name: 'Disk watermark high'
          type: DEPENDENT
          key: wazuh.indexer.watermark.high
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Effective value of cluster.routing.allocation.disk.watermark.high, in % of used disk space. -1 when the watermark is an absolute value. Above the high watermark OpenSearch moves shards away from the node.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.routing.allocation.disk.watermark.high'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.routing.allocation.disk.watermark.high is not set.';
                  }

                  // A watermark is a percentage ("85%"), a ratio ("0.85") or an absolute free space ("10gb").
                  // Absolute values are returned as -1: the disk triggers use only relative watermarks.
                  if (/^\d+(\.\d+)?%$/.test(value)) {
                  	return parseFloat(value);
                  }
                  if (/^0?\.\d+$|^1(\.0+)?$/.test(value)) {
                  	return parseFloat(value) * 100;
                  }

                  return -1;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: storage
        - uuid: '69eed7fd9aae4516bc7edaeeed7d8acc'
          name: 'Disk watermark flood stage'
          type: DEPENDENT
          key: wazuh.indexer.watermark.flood
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Effective value of cluster.routing.allocation.disk.watermark.flood_stage, in % of used disk space. -1 when the watermark is an absolute value. Above the flood-stage watermark OpenSearch sets a read-only block on every index with a shard on the node. Wazuh alerts are then no longer indexed.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.routing.allocation.disk.watermark.flood_stage'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.routing.allocation.disk.watermark.flood_stage is not set.';
                  }

                  // A watermark is a percentage ("85%"), a ratio ("0.85") or an absolute free space ("10gb").
                  // Absolute values are returned as -1: the disk triggers use only relative watermarks.
                  if (/^\d+(\.\d+)?%$/.test(value)) {
                  	return parseFloat(value);
                  }
                  if (/^0?\.\d+$|^1(\.0+)?$/.test(value)) {
                  	return parseFloat(value) * 100;
                  }

                  return -1;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: storage
        - uuid: '6c0a32fae1684437b6ca0cea3382479d'
          name: 'Shards in use, in % of the limit'
          type: CALCULATED
          key: wazuh.indexer.shards.limit.util
          delay: '1m'
          value_type: FLOAT
          units: '%'
          params: '100*(last(//wazuh.indexer.shards.active)+last(//wazuh.indexer.shards.unassigned))/(last(//wazuh.indexer.max_shards_per_node)*last(//wazuh.indexer.nodes.data))'
          description: 'Active and unassigned shards in % of the cluster shard limit (cluster.max_shards_per_node multiplied by the data nodes). New indices cannot be created when the limit is reached, so Wazuh stops indexing alerts at the next daily index rollover.'
          tags:
            - tag: component
              value: shards
          triggers:
            - uuid: '26e5471a3ea64cf7984516f6530ac84d'
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.shards.limit.util)>{$WAZUH.INDEXER.SHARDS.MAX.WARN}'
              name: 'Wazuh indexer: Shard usage is close to the cluster limit'
              event_name: 'Wazuh indexer: Shard usage is close to the cluster limit (over {$WAZUH.INDEXER.SHARDS.MAX.WARN}%)'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'When the shard limit is reached, OpenSearch refuses to create new indices and the next daily wazuh-alerts index is not created. Delete old indices, lower the replica count or raise cluster.max_shards_per_node.'
              tags:
                - tag: scope
                  value: capacity
