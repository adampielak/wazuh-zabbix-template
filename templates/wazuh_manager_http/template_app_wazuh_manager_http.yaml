zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: 'Templates/Applications'
  templates:
    - uuid: '4f2968d657434a9e92e12c876619782b'
      template: 'Wazuh manager by HTTP'
      name: 'Wazuh manager by HTTP'
      description: |
        Monitors a Wazuh server (manager) node through the Wazuh server API: API availability, daemon states, analysisd and remoted statistics, configuration validation and cluster state.
        On the master node or on a standalone manager it also collects agent connection summary, cluster node health, ruleset synchronization and available updates.

        Setup:

        1. Create a read-only Wazuh API user, for example "zbx_monitor", with read-only policies: manager:read and cluster:status on *:*:*, cluster:read on node:id:*, agent:read on agent:id:*. The README in the repository root has the API calls.
        2. Link the template to a host and set {$WAZUH.API.HOST} to the Wazuh server node. Link it to one host per cluster node: node-local data is collected on each node, cluster-wide data on the master only.
        3. Set {$WAZUH.API.USER} and {$WAZUH.API.PASSWORD}. Change {$WAZUH.API.SCHEME} and {$WAZUH.API.PORT} if the API does not listen on https:55000.
        4. Wazuh generates self-signed certificates by default, so {$HTTP.TLS.VERIFY} defaults to "none". Set it to "full" if the API certificate is trusted by the Zabbix server or proxy.

        Tested with Wazuh 4.14 and Zabbix 7.0.

        Created by Adam "tick" Pielak, https://wazuh.blog
      vendor:
        name: 'Adam "tick" Pielak'
        version: '7.0-1'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: '30909edd36d64b71a04a5d780c9c2d0d'
          name: 'Get API data'
          type: SCRIPT
          key: wazuh.manager.get
          delay: '{$WAZUH.DATA.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            const CTlsConfig = function (raw_value) {
            	raw_value = String(raw_value).trim().toLowerCase();

            	if (['none', 'peer', 'full'].indexOf(raw_value) === -1) {
            		raw_value = 'full';
            	}

            	this.options = {
            		SSLVerifyPeer: (raw_value === 'peer' || raw_value === 'full'),
            		SSLVerifyHost: (raw_value === 'full')
            	};

            	this.enabled = (raw_value !== 'none');

            	this.checkURL = function (url) {
            		if (this.enabled && !/^https:\/\//i.test(url)) {
            			throw 'TLS certificate verification is enabled by {$' + 'HTTP.TLS.VERIFY}, but the URL uses plain HTTP: ' + url +
            			'. Use an "https://" URL, or set {$' + 'HTTP.TLS.VERIFY} to `none` to disable verification.';
            		}

            		return url;
            	};
            };

            var Wazuh = {
            	params: {},
            	http: null,
            	token: null,

            	setParams: function (params) {
            		['api_url', 'user', 'password'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: "' + field + '".';
            			}
            		});

            		Wazuh.params = params;
            		Wazuh.params.api_url = String(params.api_url).replace(/\/+$/, '');
            	},

            	init: function () {
            		var tls = new CTlsConfig(Wazuh.params.tls_verify);

            		tls.checkURL(Wazuh.params.api_url);
            		Wazuh.http = new HttpRequest(tls.options);

            		if (typeof Wazuh.params.http_proxy === 'string' && Wazuh.params.http_proxy !== '') {
            			Wazuh.http.setProxy(Wazuh.params.http_proxy);
            		}
            	},

            	request: function (method, path) {
            		var url = Wazuh.params.api_url + path,
            			response,
            			status,
            			detail = '';

            		Wazuh.http.clearHeader();
            		if (Wazuh.token === null) {
            			Wazuh.http.addHeader('Authorization: Basic ' + btoa(Wazuh.params.user + ':' + Wazuh.params.password));
            		}
            		else {
            			Wazuh.http.addHeader('Authorization: Bearer ' + Wazuh.token);
            		}

            		Zabbix.log(4, '[ Wazuh ] Sending request: ' + method + ' ' + url);
            		response = (method === 'POST') ? Wazuh.http.post(url, '') : Wazuh.http.get(url);
            		status = Wazuh.http.getStatus();
            		Zabbix.log(4, '[ Wazuh ] Received response with status code ' + status + ' for ' + path);

            		if (status !== 200) {
            			try {
            				var body = JSON.parse(response);

            				detail = body.detail || body.title || '';
            			}
            			catch (error) {
            				// Not a JSON error body.
            			}

            			throw 'Request ' + method + ' ' + path + ' failed with status code ' + status + (detail ? ': ' + detail : '') + '.';
            		}

            		if (response === null || response === '') {
            			throw 'Empty response for ' + method + ' ' + path + '.';
            		}

            		return response;
            	},

            	get: function (path) {
            		var body;

            		try {
            			body = JSON.parse(Wazuh.request('GET', path));
            		}
            		catch (error) {
            			throw (typeof error === 'string') ? error : 'Failed to parse the response of ' + path + '.';
            		}

            		if (typeof body.data === 'undefined') {
            			throw 'Unexpected response of ' + path + ': no "data" field.';
            		}

            		return body.data;
            	},

            	login: function () {
            		Wazuh.token = Wazuh.request('POST', '/security/user/authenticate?raw=true');
            	}
            };

            // Wazuh returns timestamps with microseconds; ECMAScript Date.parse accepts milliseconds only.
            function parseDate(value) {
            	return Date.parse(String(value).replace(/(\.\d{3})\d+/, '$1'));
            }

            function sumLeaves(object) {
            	var total = 0;

            	Object.keys(object || {}).forEach(function (key) {
            		var value = object[key];

            		if (typeof value === 'number') {
            			total += value;
            		}
            		else if (value !== null && typeof value === 'object') {
            			total += sumLeaves(value);
            		}
            	});

            	return total;
            }

            function round(value) {
            	return Math.round(value * 100) / 100;
            }

            var result = {api: {available: 0, version: ''}, error: ''},
            	errors = [];

            function collect(section, callback) {
            	try {
            		callback();
            	}
            	catch (error) {
            		errors.push(section + ': ' + error);
            		Zabbix.log(3, '[ Wazuh ] Failed to collect "' + section + '": ' + error);
            	}
            }

            Wazuh.setParams(JSON.parse(value));
            Wazuh.init();

            try {
            	Wazuh.login();
            	result.api.available = 1;
            }
            catch (error) {
            	result.error = 'login: ' + error;
            	Zabbix.log(3, '[ Wazuh ] Login failed: ' + error);

            	return JSON.stringify(result);
            }

            collect('api', function () {
            	result.api.version = Wazuh.get('/').api_version;
            });

            collect('manager', function () {
            	var info = Wazuh.get('/manager/info').affected_items[0];

            	result.manager = {version: String(info.version).replace(/^v/, ''), type: info.type};
            });

            collect('daemons', function () {
            	var status = Wazuh.get('/manager/status').affected_items[0];

            	result.daemons = {};
            	Object.keys(status).forEach(function (name) {
            		result.daemons[name] = (status[name] === 'running') ? 1 : ((status[name] === 'stopped') ? 0 : 2);
            	});
            });

            collect('stats', function () {
            	Wazuh.get('/manager/daemons/stats').affected_items.forEach(function (daemon) {
            		var metrics = daemon.metrics || {};

            		metrics.uptime = Math.max(0, Math.round((parseDate(daemon.timestamp) - parseDate(daemon.uptime)) / 1000));
            		result[String(daemon.name).replace(/^wazuh-/, '')] = metrics;
            	});

            	if (result.analysisd) {
            		var events = result.analysisd.events || {},
            			queues = result.analysisd.queues || {};

            		events.dropped_total = sumLeaves((events.received_breakdown || {}).dropped_breakdown);
            		// analysisd reports queue usage as a ratio (0..1).
            		Object.keys(queues).forEach(function (name) {
            			queues[name].pct = round(queues[name].usage * 100);
            		});
            	}

            	if (result.remoted && result.remoted.queues && result.remoted.queues.received) {
            		var received = result.remoted.queues.received;

            		// remoted reports queue usage as a number of messages.
            		received.pct = (received.size > 0) ? round(received.usage / received.size * 100) : 0;
            	}
            });

            collect('cluster', function () {
            	var status = Wazuh.get('/cluster/status');

            	result.cluster = {
            		enabled: (status.enabled === 'yes') ? 1 : 0,
            		running: (status.running === 'yes') ? 1 : 0,
            		name: '',
            		node: '',
            		role: 'standalone'
            	};

            	if (result.cluster.running === 1) {
            		var local = Wazuh.get('/cluster/local/info').affected_items[0];

            		result.cluster.name = local.cluster;
            		result.cluster.node = local.node;
            		result.cluster.role = local.type;
            	}
            });

            collect('configuration', function () {
            	var validation = Wazuh.get('/manager/configuration/validation'),
            		valid = (validation.total_failed_items === 0);

            	(validation.affected_items || []).forEach(function (node) {
            		if (node.status !== 'OK') {
            			valid = false;
            		}
            	});
            	result.configuration = {valid: valid ? 1 : 0};
            });

            // Cluster-wide data is read on the master or on a standalone manager only.
            if (result.cluster && result.cluster.role !== 'worker') {
            	collect('agents', function () {
            		var summary = Wazuh.get('/agents/summary/status'),
            			agents = summary.connection;

            		agents.not_synced = summary.configuration.not_synced;
            		agents.disconnected_pct = (agents.total > 0) ? round(agents.disconnected / agents.total * 100) : 0;
            		result.agents = agents;
            	});

            	collect('updates', function () {
            		var check = Wazuh.get('/manager/version/check');

            		result.updates = {
            			enabled: check.update_check ? 1 : 0,
            			latest: (check.last_available_major || {}).tag || (check.last_available_minor || {}).tag
            				|| (check.last_available_patch || {}).tag || ''
            		};
            	});

            	result.nodes = [];
            	if (result.cluster.running === 1) {
            		collect('nodes', function () {
            			var now = Date.now();

            			result.nodes = Wazuh.get('/cluster/healthcheck').affected_items.map(function (node) {
            				var status = node.status || {};

            				return {
            					name: node.info.name,
            					type: node.info.type,
            					version: node.info.version,
            					active_agents: node.info.n_active_agents,
            					keepalive_age: status.last_keep_alive
            						? Math.max(0, Math.round((now - parseDate(status.last_keep_alive)) / 1000))
            						: null,
            					ruleset_synced: null
            				};
            			});
            		});

            		collect('ruleset', function () {
            			Wazuh.get('/cluster/ruleset/synchronization').affected_items.forEach(function (sync) {
            				result.nodes.forEach(function (node) {
            					if (node.name === sync.name) {
            						node.ruleset_synced = sync.synced ? 1 : 0;
            					}
            				});
            			});
            		});
            	}
            }

            result.error = errors.join('\n');

            return JSON.stringify(result);
          parameters:
            - name: api_url
              value: '{$WAZUH.API.SCHEME}://{$WAZUH.API.HOST}:{$WAZUH.API.PORT}'
            - name: http_proxy
              value: '{$WAZUH.HTTP_PROXY}'
            - name: password
              value: '{$WAZUH.API.PASSWORD}'
            - name: tls_verify
              value: '{$HTTP.TLS.VERIFY:"Wazuh"}'
            - name: user
              value: '{$WAZUH.API.USER}'
          timeout: '30s'
          description: 'Logs in to the Wazuh server API and collects manager, daemon, statistics and cluster data in one JSON document. A failed API section is reported in the "API errors" item and does not stop the other sections.'
          tags:
            - tag: component
              value: raw
        - uuid: '83b2d042ed6a49feb6d3cdddc198f8b2'
          name: 'API availability'
          type: DEPENDENT
          key: wazuh.api.available
          delay: '0'
          description: 'Result of the login to the Wazuh server API: 1 - logged in, 0 - connection or authentication failed.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.api.available'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: '682339515649451eb681b8893cb92b98'
              expression: 'max(/Wazuh manager by HTTP/wazuh.api.available,3m)=0'
              name: 'Wazuh: API is not available'
              priority: AVERAGE
              description: 'Login to the Wazuh server API failed for 3 minutes. Check the "API errors" item, wazuh-apid on the node, the network path and the API credentials.'
              tags:
                - tag: scope
                  value: availability
            - uuid: '53e46697b3d2451291aaaf05e19bec68'
              expression: 'nodata(/Wazuh manager by HTTP/wazuh.api.available,30m)=1'
              name: 'Wazuh: Failed to fetch API data'
              event_name: 'Wazuh: Failed to fetch API data (or no data for 30m)'
              priority: WARNING
              description: 'The script item returned no data for 30 minutes. Check the item error and the Zabbix server or proxy log.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: '60f66dd5db804417844d8cb07a4618e3'
          name: 'API errors'
          type: DEPENDENT
          key: wazuh.api.errors
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Errors returned by the API requests of the last collection. Empty when all requests succeeded.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.error'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: fecc26a5d67d448a9cef94e4a408b09f
              expression: 'length(last(/Wazuh manager by HTTP/wazuh.api.errors))>0'
              name: 'Wazuh: API requests returned errors'
              opdata: '{ITEM.LASTVALUE1}'
              priority: INFO
              description: 'One or more API requests failed. The items fed by that request have no new data. A common cause is a missing RBAC permission of the monitoring user.'
              dependencies:
                - name: 'Wazuh: API is not available'
                  expression: 'max(/Wazuh manager by HTTP/wazuh.api.available,3m)=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: ab679b2372924c3b9b52babf705765f3
          name: 'API version'
          type: DEPENDENT
          key: wazuh.api.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Version of the Wazuh server API.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.api.version'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: application
        - uuid: '87abffeb1ffa4a2c8c0635d577eb65af'
          name: Version
          type: DEPENDENT
          key: wazuh.manager.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Version of the Wazuh manager.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.manager.version'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: '6789ffa6ea774245ad3b285a25b06b9e'
              expression: 'last(/Wazuh manager by HTTP/wazuh.manager.version,#1)<>last(/Wazuh manager by HTTP/wazuh.manager.version,#2) and length(last(/Wazuh manager by HTTP/wazuh.manager.version))>0'
              name: 'Wazuh: Version has changed'
              priority: INFO
              description: 'The Wazuh manager version has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: '316da49c5a4c40a1bb93625fa124e0c2'
          name: 'Configuration status'
          type: DEPENDENT
          key: wazuh.manager.config.valid
          delay: '0'
          description: 'Result of the Wazuh configuration validation (GET /manager/configuration/validation).'
          valuemap:
            name: 'Wazuh configuration status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.configuration.valid'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: configuration
          triggers:
            - uuid: ddef212113944e0ebb2c4a10c8a98ecd
              expression: 'last(/Wazuh manager by HTTP/wazuh.manager.config.valid)=0'
              name: 'Wazuh: Configuration is not valid'
              priority: AVERAGE
              description: 'GET /manager/configuration/validation reports an error. The manager will fail to start with the current ossec.conf. Run /var/ossec/bin/wazuh-analysisd -t on the node.'
              tags:
                - tag: scope
                  value: notice
        - uuid: cdf734dfad004cb7bc56732c1ec5e3e6
          name: 'Cluster: Enabled'
          type: DEPENDENT
          key: wazuh.cluster.enabled
          delay: '0'
          description: 'Whether the cluster is enabled in the manager configuration.'
          valuemap:
            name: 'Wazuh boolean'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster.enabled'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: cluster
        - uuid: c0bff2c5112f44f49d8ff874d9935b83
          name: 'Cluster: Running'
          type: DEPENDENT
          key: wazuh.cluster.running
          delay: '0'
          description: 'Whether the cluster daemon is running.'
          valuemap:
            name: 'Wazuh boolean'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster.running'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: cluster
        - uuid: '6085251294364f7fa25888774a1f46f6'
          name: 'Cluster: Node role'
          type: DEPENDENT
          key: wazuh.cluster.role
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Role of this node: master, worker or standalone.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster.role'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: cluster
        - uuid: '0357ccaffd884ae7b8053c0c8f888c3a'
          name: 'Cluster: Node name'
          type: DEPENDENT
          key: wazuh.cluster.node
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of this node in the cluster. Empty on a standalone manager.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster.node'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: cluster
        - uuid: '558dd5d6a6a04742a482644338d47b29'
          name: 'Cluster: Name'
          type: DEPENDENT
          key: wazuh.cluster.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of the cluster. Empty on a standalone manager.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.cluster.name'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: cluster
        - uuid: '9c5bbf9ea93b468a84b9036933fa1ecc'
          name: 'Analysisd: Uptime'
          type: DEPENDENT
          key: wazuh.analysisd.uptime
          delay: '0'
          units: uptime
          description: 'Time since wazuh-analysisd started.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.analysisd.uptime'
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: analysisd
          triggers:
            - uuid: ab69bd6afd8d419da4224c2045909e61
              expression: 'last(/Wazuh manager by HTTP/wazuh.analysisd.uptime)<10m'
              name: 'Wazuh: Analysisd has been restarted'
              event_name: 'Wazuh: Analysisd has been restarted (uptime < 10m)'
              priority: INFO
              description: 'wazuh-analysisd started less than 10 minutes ago.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: '3ac47bf187ee4381aaf004e2560d9c8a'
          name: 'Analysisd: Events received per second'
          type: DEPENDENT
          key: wazuh.analysisd.events.received.rate
          delay: '0'
          value_type: FLOAT
          units: eps
          description: 'Events received by wazuh-analysisd.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.analysisd.events.received'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: analysisd
        - uuid: f317da0533ae45409abfad2dce8a3139
          name: 'Analysisd: Events processed per second'
          type: DEPENDENT
          key: wazuh.analysisd.events.processed.rate
          delay: '0'
          value_type: FLOAT
          units: eps
          description: 'Events processed by the rule engine.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.analysisd.events.processed'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: analysisd
        - uuid: cec4bd32c4214892a22b83c4932ce976
          name: 'Analysisd: Events dropped per second'
          type: DEPENDENT
          key: wazuh.analysisd.events.dropped.rate
          delay: '0'
          value_type: FLOAT
          units: eps
          description: 'Events dropped by wazuh-analysisd because an input queue was full. Sum of all counters in events.received_breakdown.dropped_breakdown.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.analysisd.events.dropped_total'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: wazuh.manager.get
          tags:
            - tag: component
              value: analysisd
          triggers:
            - uuid: '0ca168b76d70467db286f1fd5a132bb1'
              expression: 'min(/Wazuh manager by HTTP/wazuh.analysisd.events.dropped.rate,5m)>0'
              name: 'Wazuh: Analysisd is dropping events'
              opdata: 'Dropped: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'wazuh-analysisd dropped events for 5 minutes because input queues were full. Events that are dropped do not generate alerts. Check the analysisd queue utilization and the event rate.'
              tags:
                - tag: scope
                  value: performance
