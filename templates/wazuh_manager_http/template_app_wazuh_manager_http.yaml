            - uuid: '4998829811f34a2493aadcfbf1912ed0'
              name: 'Cluster: Nodes'
              type: DEPENDENT
              key: 'wazuh.cluster.nodes[{#SINGLETON}]'
              delay: '0'
              description: 'Nodes reported by the cluster health check. Zero on a standalone manager.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);

