                - uuid: '06c090eda82243fb9f1e5e63b2b7560b'
                  expression: 'max(/Wazuh manager by HTTP/wazuh.cluster.node.ruleset.synced[{#NODE.NAME}],15m)=0'
                  name: 'Wazuh: Cluster node [{#NODE.NAME}]: Ruleset is not synchronized'
                  priority: WARNING
                  description: 'The node ruleset differs from the master for 15 minutes. The node may evaluate events with outdated rules or decoders.'
                  tags:
                    - tag: scope
                      value: notice
          trigger_prototypes:
            - uuid: '04e7d770884b4d88a4b9271dfd3ac0b4'
              expression: 'last(/Wazuh manager by HTTP/wazuh.cluster.node.version[{#NODE.NAME}])<>last(/Wazuh manager by HTTP/wazuh.manager.version)'
              name: 'Wazuh: Cluster node [{#NODE.NAME}]: Version differs from the master'
              opdata: 'Node: {ITEM.LASTVALUE1}, master: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'All cluster nodes must run the same Wazuh version.'
              tags:
                - tag: scope
                  value: notice
          master_item:
            key: wazuh.manager.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);

                  if (!data.api || data.api.available !== 1) {
                  	throw 'The Wazuh API is not available.';
                  }

                  if (!Array.isArray(data.nodes)) {
                  	throw 'No cluster node data.';
                  }

                  return JSON.stringify(data.nodes.map(function (node) {
                  	return {'{#NODE.NAME}': node.name, '{#NODE.TYPE}': node.type};
                  }));
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          overrides:
            - name: 'Master node'
              step: '1'
              filter:
                conditions:
                  - macro: '{#NODE.TYPE}'
                    value: '^master$'
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: keep-alive
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: keep-alive
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'not reported'
                  discover: NO_DISCOVER
        - uuid: d1f9a87947b644259c5565d3316b8d9b
          name: 'Analysisd queues discovery'
          type: DEPENDENT
          key: wazuh.analysisd.queue.discovery
          delay: '0'
          description: 'Discovers the input and output queues of wazuh-analysisd.'
          item_prototypes:
            - uuid: '515212c3740c4837bdaf64bbda1ef35d'
              name: 'Analysisd: Queue [{#QUEUE}] utilization'
              type: DEPENDENT
              key: 'wazuh.analysisd.queue.util[{#QUEUE}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: 'Utilization of the analysisd queue. A full input queue makes analysisd drop events.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.analysisd.queues[''{#QUEUE}''].pct'
              master_item:
                key: wazuh.manager.get
              tags:
                - tag: component
                  value: analysisd
                - tag: queue
                  value: '{#QUEUE}'
              trigger_prototypes:
                - uuid: f7605ceb03ef46f68f54ae73f9f9a07c
                  expression: 'min(/Wazuh manager by HTTP/wazuh.analysisd.queue.util[{#QUEUE}],5m)>{$WAZUH.QUEUE.UTIL.MAX.WARN}'
                  name: 'Wazuh: Analysisd queue [{#QUEUE}] utilization is high'
                  event_name: 'Wazuh: Analysisd queue [{#QUEUE}] utilization is high (over {$WAZUH.QUEUE.UTIL.MAX.WARN}% for 5m)'
                  opdata: 'Utilization: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Events wait in the analysisd queue. A full input queue makes analysisd drop events.'
                  dependencies:
                    - name: 'Wazuh: Analysisd queue [{#QUEUE}] utilization is critical'
                      expression: 'min(/Wazuh manager by HTTP/wazuh.analysisd.queue.util[{#QUEUE}],5m)>{$WAZUH.QUEUE.UTIL.MAX.CRIT}'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: af7aa407d53b4cb9af3e90e689a67bd4
                  expression: 'min(/Wazuh manager by HTTP/wazuh.analysisd.queue.util[{#QUEUE}],5m)>{$WAZUH.QUEUE.UTIL.MAX.CRIT}'
                  name: 'Wazuh: Analysisd queue [{#QUEUE}] utilization is critical'
                  event_name: 'Wazuh: Analysisd queue [{#QUEUE}] utilization is critical (over {$WAZUH.QUEUE.UTIL.MAX.CRIT}% for 5m)'
                  opdata: 'Utilization: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The analysisd queue is almost full.'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: '6b4fca8647be40b6a231302c928f330c'
              name: 'Analysisd: Queue [{#QUEUE}] size'
              type: DEPENDENT
              key: 'wazuh.analysisd.queue.size[{#QUEUE}]'
              delay: '0'
              description: 'Capacity of the analysisd queue, in events.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.analysisd.queues[''{#QUEUE}''].size'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - '1d'
              master_item:
                key: wazuh.manager.get
              tags:
                - tag: component
                  value: analysisd
                - tag: queue
                  value: '{#QUEUE}'
          master_item:
            key: wazuh.manager.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);

                  if (!data.api || data.api.available !== 1) {
                  	throw 'The Wazuh API is not available.';
                  }

                  if (!data.analysisd || !data.analysisd.queues) {
                  	throw 'No analysisd queue data.';
                  }

                  return JSON.stringify(Object.keys(data.analysisd.queues).map(function (name) {
                  	return {'{#QUEUE}': name};
                  }));
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
        - uuid: ba2bc8189e5340829b580c2a7d2a9cd0
          name: 'Daemons discovery'
          type: DEPENDENT
          key: wazuh.daemon.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#DAEMON}'
                value: '{$WAZUH.LLD.FILTER.DAEMON.MATCHES}'
                formulaid: A
              - macro: '{#DAEMON}'
                value: '{$WAZUH.LLD.FILTER.DAEMON.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovers Wazuh daemons from GET /manager/status. wazuh-clusterd is skipped when the cluster is disabled.'
          item_prototypes:
            - uuid: '37eff3f7e7eb44f9baccf287ddcd6e24'
              name: 'Daemon [{#DAEMON}]: State'
              type: DEPENDENT
              key: 'wazuh.daemon.state[{#DAEMON}]'
              delay: '0'
              description: 'State of the daemon reported by GET /manager/status.'
              valuemap:
                name: 'Wazuh daemon state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.daemons[''{#DAEMON}'']'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - '1h'
              master_item:
                key: wazuh.manager.get
              tags:
                - tag: component
                  value: daemon
                - tag: daemon
                  value: '{#DAEMON}'
              trigger_prototypes:
                - uuid: fd2d0708fe1c4983ba62a687d5b4d7d2
                  expression: 'last(/Wazuh manager by HTTP/wazuh.daemon.state[{#DAEMON}])<>1'
                  name: 'Wazuh: Daemon [{#DAEMON}] is not running'
                  opdata: 'State: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The daemon is not running. Daemons that are optional by configuration are matched by {$WAZUH.DAEMON.OPTIONAL.MATCHES} and have no trigger.'
                  dependencies:
                    - name: 'Wazuh: API is not available'
                      expression: 'max(/Wazuh manager by HTTP/wazuh.api.available,3m)=0'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: wazuh.manager.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);

                  if (!data.api || data.api.available !== 1) {
                  	throw 'The Wazuh API is not available.';
                  }

                  if (!data.daemons) {
                  	throw 'No daemon data.';
                  }

                  return JSON.stringify(Object.keys(data.daemons).filter(function (name) {
                  	return !(name === 'wazuh-clusterd' && data.cluster && data.cluster.enabled === 0);
                  }).map(function (name) {
                  	return {'{#DAEMON}': name};
                  }));
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          overrides:
            - name: 'Optional daemons'
              step: '1'
              filter:
                conditions:
                  - macro: '{#DAEMON}'
                    value: '{$WAZUH.DAEMON.OPTIONAL.MATCHES}'
                    formulaid: A
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'is not running'
                  discover: NO_DISCOVER
      tags:
        - tag: class
          value: software
        - tag: target
          value: wazuh
      macros:
        - macro: '{$HTTP.TLS.VERIFY}'
          value: none
          description: 'TLS certificate verification for the script item: "none" - disabled, "peer" - verify the certificate chain and expiration, "full" - full verification. Any other value enables full verification. To override the setting for this template only, define the macro with the context "Wazuh", e.g. {$HTTP.TLS.VERIFY:"Wazuh"}. Requires a Zabbix server or proxy version that supports TLS options in the HttpRequest constructor.'
        - macro: '{$WAZUH.AGENTS.DISCONNECTED.MAX.WARN}'
          value: '10'
          description: 'Maximum share of disconnected agents, in %, for the trigger expression.'
        - macro: '{$WAZUH.API.HOST}'
          value: '<SET WAZUH API HOST>'
          description: 'Hostname or IP address of the Wazuh server node.'
        - macro: '{$WAZUH.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Password of the Wazuh server API user.'
        - macro: '{$WAZUH.API.PORT}'
          value: '55000'
          description: 'Wazuh server API port.'
        - macro: '{$WAZUH.API.SCHEME}'
          value: https
          description: 'Wazuh server API scheme (http or https).'
        - macro: '{$WAZUH.API.USER}'
          value: zbx_monitor
          description: 'Wazuh server API user with read-only RBAC permissions.'
        - macro: '{$WAZUH.CLUSTER.KEEPALIVE.MAX.WARN}'
          value: '5m'
          description: 'Maximum age of the last keep-alive received by the master from a worker node.'
        - macro: '{$WAZUH.DAEMON.OPTIONAL.MATCHES}'
          value: '^wazuh-(agentlessd|csyslogd|dbd|integratord|maild|reportd)$'
          description: 'Daemons that run only when enabled in ossec.conf. No "is not running" trigger is created for them. Remove a daemon from the list if your configuration requires it.'
        - macro: '{$WAZUH.DATA.INTERVAL}'
          value: '1m'
          description: 'Update interval of the API data item.'
        - macro: '{$WAZUH.HTTP_PROXY}'
          value: ''
          description: 'HTTP proxy for API requests, for example http://proxy.example.com:3128. Leave empty to connect directly.'
        - macro: '{$WAZUH.LLD.FILTER.DAEMON.MATCHES}'
          value: '.*'
          description: 'Filter of discoverable Wazuh daemons by name.'
        - macro: '{$WAZUH.LLD.FILTER.DAEMON.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Filter to exclude discovered Wazuh daemons by name.'
        - macro: '{$WAZUH.QUEUE.UTIL.MAX.CRIT}'
          value: '95'
          description: 'Critical threshold of analysisd and remoted queue utilization, in %.'
        - macro: '{$WAZUH.QUEUE.UTIL.MAX.WARN}'
          value: '80'
          description: 'Warning threshold of analysisd and remoted queue utilization, in %.'
      dashboards:
        - uuid: '22b6fd0003da4b4588e4d2ba6896b6e7'
          name: 'Wazuh manager'
          pages:
            - name: Overview
              widgets:
                - type: graph
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'Wazuh manager by HTTP'
                        name: 'Wazuh: Analysisd events'
                    - type: STRING
                      name: reference
                      value: AAAAA
                - type: graph
                  x: '36'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'Wazuh manager by HTTP'
                        name: 'Wazuh: Analysisd output'
                    - type: STRING
                      name: reference
                      value: AAAAB
                - type: graph
                  'y': '5'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'Wazuh manager by HTTP'
                        name: 'Wazuh: Remoted messages'
                    - type: STRING
                      name: reference
                      value: AAAAC
                - type: graph
                  x: '36'
                  'y': '5'
                  width: '36'
                  height: '5'
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: 'Wazuh manager by HTTP'
