                      value: performance
            - uuid: '68f0923e622540af94e9b23d1f1d6ad1'
              name: 'Node [{#NODE.NAME}]: Search rejections per second'
              type: DEPENDENT
              key: 'wazuh.indexer.node.search.rejected.rate[{#NODE.NAME}]'
              delay: '0'
              value_type: FLOAT
              units: rps
              description: 'Rejected tasks of the search thread pool.'
              preprocessing:
