            key: wazuh.indexer.alerts.get
          tags:
            - tag: component
              value: alerts
          triggers:
            - uuid: '17b9436961c84f1abb4a40705c7cb573'
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.alerts.count)=0'
              name: 'Wazuh indexer: No alerts indexed'
              event_name: 'Wazuh indexer: No alerts indexed in the last {$WAZUH.INDEXER.ALERTS.WINDOW}'
              priority: HIGH
              description: 'No document was written to {$WAZUH.INDEXER.ALERTS.INDEX} in the time window. Check the Filebeat output on the Wazuh server nodes, the indexer health and the disk watermarks.'
              dependencies:
                - name: 'Wazuh indexer: Service is down'
                  expression: 'last(/Wazuh indexer by HTTP/net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"])=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: '159843d5ed194c3986ebeb32520607b8'
          name: 'Newest alert time'
          type: DEPENDENT
          key: wazuh.indexer.alerts.last
          delay: '0'
          units: unixtime
          description: 'Timestamp of the newest alert in the alerts index. No value when no alert was indexed in the time window.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.aggregations.last.value'
            - type: MULTIPLIER
              parameters:
                - '0.001'
          master_item:
            key: wazuh.indexer.alerts.get
          tags:
            - tag: component
              value: alerts
      discovery_rules:
        - uuid: '80d93bfc87214def874c9a40eda3e836'
          name: 'Nodes discovery'
          type: DEPENDENT
          key: wazuh.indexer.nodes.discovery
          delay: '0'
          lld_macro_paths:
            - lld_macro: '{#NODE.NAME}'
              path: '$.name'
            - lld_macro: '{#NODE.ROLES}'
              path: '$.roles'
          description: 'Discovers the nodes of the indexer cluster.'
          item_prototypes:
            - uuid: '5567656001d14ec78a15296c563321af'
              name: 'Node [{#NODE.NAME}]: Get data'
              type: DEPENDENT
              key: 'wazuh.indexer.node.get[{#NODE.NAME}]'
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Normalized statistics of the node.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value),
                      	nodes = [];

                      function pct(part, total) {
                      	return (total > 0) ? Math.round(part / total * 10000) / 100 : 0;
                      }

                      Object.keys(data.nodes || {}).forEach(function (id) {
                      	var node = data.nodes[id],
                      		fs = (node.fs || {}).total || {},
                      		process = node.process || {},
                      		pools = node.thread_pool || {};

                      	nodes.push({
                      		name: node.name,
                      		roles: (node.roles || []).join(','),
                      		heap_pct: node.jvm.mem.heap_used_percent,
                      		uptime: Math.floor(node.jvm.uptime_in_millis / 1000),
                      		cpu_pct: node.os.cpu.percent,
                      		disk_total: fs.total_in_bytes,
                      		disk_available: fs.available_in_bytes,
                      		disk_pct: pct(fs.total_in_bytes - fs.available_in_bytes, fs.total_in_bytes),
                      		fd_pct: pct(process.open_file_descriptors, process.max_file_descriptors),
                      		write_rejected: (pools.write || {}).rejected,
                      		search_rejected: (pools.search || {}).rejected,
                      		breaker_tripped: ((node.breakers || {}).parent || {}).tripped
                      	});
                      });

                      return JSON.stringify(nodes);
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name==''{#NODE.NAME}'')].first()'
              master_item:
                key: wazuh.indexer.nodes.get_stats
              tags:
                - tag: component
                  value: raw
                - tag: node
                  value: '{#NODE.NAME}'
            - uuid: '4a09e9336e5b4717898e70554a6895af'
              name: 'Node [{#NODE.NAME}]: JVM heap usage'
              type: DEPENDENT
              key: 'wazuh.indexer.node.heap.util[{#NODE.NAME}]'
              delay: '0'
              units: '%'
              description: 'Used JVM heap, in % of the maximum heap.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.heap_pct'
              master_item:
                key: 'wazuh.indexer.node.get[{#NODE.NAME}]'
              tags:
                - tag: component
                  value: memory
                - tag: node
                  value: '{#NODE.NAME}'
              trigger_prototypes:
                - uuid: '87df1e546afb43c3a465b9bbc6660cd0'
                  expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.heap.util[{#NODE.NAME}],1h)>{$WAZUH.INDEXER.HEAP.MAX.WARN}'
                  name: 'Wazuh indexer: Node [{#NODE.NAME}]: JVM heap usage is high'
                  event_name: 'Wazuh indexer: Node [{#NODE.NAME}]: JVM heap usage is high (over {$WAZUH.INDEXER.HEAP.MAX.WARN}% for 1h)'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'JVM heap usage is above the threshold for one hour.'
                  dependencies:
                    - name: 'Wazuh indexer: Node [{#NODE.NAME}]: JVM heap usage is critical'
                      expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.heap.util[{#NODE.NAME}],1h)>{$WAZUH.INDEXER.HEAP.MAX.CRIT}'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: adf8ab63068941d7bca11f04d6cfc0ab
                  expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.heap.util[{#NODE.NAME}],1h)>{$WAZUH.INDEXER.HEAP.MAX.CRIT}'
                  name: 'Wazuh indexer: Node [{#NODE.NAME}]: JVM heap usage is critical'
                  event_name: 'Wazuh indexer: Node [{#NODE.NAME}]: JVM heap usage is critical (over {$WAZUH.INDEXER.HEAP.MAX.CRIT}% for 1h)'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'JVM heap usage is close to the limit. The node can trip circuit breakers or run out of memory.'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: '1537231439114a95b5a9ee981b173110'
              name: 'Node [{#NODE.NAME}]: Uptime'
              type: DEPENDENT
              key: 'wazuh.indexer.node.uptime[{#NODE.NAME}]'
              delay: '0'
              units: uptime
              description: 'Time since the JVM of the node started.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.uptime'
              master_item:
                key: 'wazuh.indexer.node.get[{#NODE.NAME}]'
              tags:
                - tag: component
                  value: application
                - tag: node
                  value: '{#NODE.NAME}'
              trigger_prototypes:
                - uuid: b126f2eb993e4c8ba212072f7aa780f0
                  expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.node.uptime[{#NODE.NAME}])<10m'
                  name: 'Wazuh indexer: Node [{#NODE.NAME}]: Has been restarted'
                  event_name: 'Wazuh indexer: Node [{#NODE.NAME}]: Has been restarted (uptime < 10m)'
                  priority: INFO
                  description: 'The JVM of the node started less than 10 minutes ago.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: e25e33673cef430ca64d420ee6148f9c
              name: 'Node [{#NODE.NAME}]: CPU usage'
              type: DEPENDENT
              key: 'wazuh.indexer.node.cpu.util[{#NODE.NAME}]'
              delay: '0'
              units: '%'
              description: 'CPU usage of the node host, as reported by OpenSearch.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cpu_pct'
              master_item:
                key: 'wazuh.indexer.node.get[{#NODE.NAME}]'
              tags:
                - tag: component
                  value: cpu
                - tag: node
                  value: '{#NODE.NAME}'
            - uuid: '124f59cfdcc64ec2a16ba58d2af221d8'
              name: 'Node [{#NODE.NAME}]: Disk total'
              type: DEPENDENT
              key: 'wazuh.indexer.node.disk.total[{#NODE.NAME}]'
              delay: '0'
              units: B
              description: 'Total size of the data paths.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.disk_total'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - '1d'
              master_item:
                key: 'wazuh.indexer.node.get[{#NODE.NAME}]'
              tags:
                - tag: component
                  value: storage
                - tag: node
