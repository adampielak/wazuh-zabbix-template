                  value: capacity
            - uuid: c0410b93406e46e8a9b0664524186836
              expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.disk.util[{#NODE.NAME}],5m)>last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.high) and last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.high)>0'
              name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage is over the high watermark'
              opdata: 'Used: {ITEM.LASTVALUE1}, watermark: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'OpenSearch moves shards away from the node.'
              dependencies:
                - name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage is over the flood stage watermark'
                  expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.disk.util[{#NODE.NAME}],5m)>last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.flood) and last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.flood)>0'
              tags:
                - tag: scope
                  value: capacity
            - uuid: '6bfd65de9ba7464e91512a93d973ab32'
              expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.disk.util[{#NODE.NAME}],5m)>last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.flood) and last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.flood)>0'
              name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage is over the flood stage watermark'
              opdata: 'Used: {ITEM.LASTVALUE1}, watermark: {ITEM.LASTVALUE2}'
              priority: HIGH
              description: 'OpenSearch sets a read-only block on every index with a shard on the node. Alerts are no longer indexed in these indices.'
              tags:
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: c6515d2996f24fe5a4735cfa5f38f5a0
              name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage'
              ymin_type_1: FIXED
              graph_items:
                - color: '7499FF'
                  item:
                    host: 'Wazuh indexer by HTTP'
