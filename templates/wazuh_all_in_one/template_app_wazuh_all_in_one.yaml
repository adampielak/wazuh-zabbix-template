              tags:
                - tag: component
                  value: memory
                - tag: node
                  value: '{#NODE.NAME}'
              trigger_prototypes:
                - uuid: bc63ff1856794cd0b81322012d163455
                  expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.breaker.tripped.rate[{#NODE.NAME}],5m)>0'
                  name: 'Wazuh indexer: Node [{#NODE.NAME}]: Parent circuit breaker trips'
                  opdata: 'Rate: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The parent circuit breaker rejects requests because the JVM heap is close to its limit.'
                  tags:
                    - tag: scope
