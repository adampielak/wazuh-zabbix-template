            - uuid: ab1d6ab919ae4c90ae315bd07f1427b2
              name: 'Node [{#NODE.NAME}]: Parent breaker trips per second'
              type: DEPENDENT
              key: 'wazuh.indexer.node.breaker.tripped.rate[{#NODE.NAME}]'
              delay: '0'
              value_type: FLOAT
              description: 'Trips of the parent circuit breaker. A trip rejects the request to protect the JVM heap.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.breaker_tripped'
