                    - type: STRING
                      name: reference
                      value: AAAAD
                - type: graphprototype
                  'y': '10'
                  width: '72'
                  height: '5'
                  fields:
                    - type: GRAPH_PROTOTYPE
                      name: graphid.0
                      value:
                        host: 'Wazuh manager by HTTP'
                        name: 'Wazuh: Agents by connection status'
                    - type: INTEGER
                      name: columns
                      value: '1'
                    - type: INTEGER
                      name: rows
                      value: '1'
                    - type: STRING
                      name: reference
                      value: AAAAE
      valuemaps:
        - uuid: ef6a97c58d9d4b4c84fd526bbbad91e9
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: '279d1515ad6b496b83913936e50ce081'
          name: 'Wazuh daemon state'
          mappings:
            - value: '0'
              newvalue: Stopped
            - value: '1'
              newvalue: Running
            - value: '2'
              newvalue: Other
        - uuid: '83dda483fd884cecbf119303b510bb97'
          name: 'Wazuh boolean'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: '37a1271b7f1e4ee0af33a528b9d8c8a4'
          name: 'Wazuh configuration status'
          mappings:
            - value: '0'
              newvalue: Invalid
            - value: '1'
              newvalue: Valid
    - uuid: '1b28bd8ccc6e4ddaba1b6e0033894960'
      template: 'Wazuh indexer by HTTP'
      name: 'Wazuh indexer by HTTP'
      description: |
        Monitors the Wazuh indexer (OpenSearch) cluster through its REST API: cluster health, shard allocation and limits, disk watermarks, per-node JVM heap, disk, CPU, file descriptors, thread pool rejections, circuit breakers, and the ingest of Wazuh alerts.

        Setup:

        1. Create an indexer user for monitoring. It needs the cluster permission cluster_monitor and the index permission indices:data/read/search on the alerts index pattern (wazuh-alerts-* by default). The README in the repository root has an example role.
        2. Link the template to a host and set {$WAZUH.INDEXER.HOST} to one indexer node, or to a load balancer in front of the cluster. All cluster data is collected through this node, so link the template to one host per cluster.
        3. Set {$WAZUH.INDEXER.USER} and {$WAZUH.INDEXER.PASSWORD}.

        The Wazuh indexer uses https on port 9200 by default. Certificates are not verified: the HTTP agent items do not set "verify_peer" and "verify_host".

        Tested with Wazuh indexer 4.14 (OpenSearch 2.19) and Zabbix 7.0.

        Created by Adam "tick" Pielak, https://wazuh.blog
      vendor:
        name: 'Adam "tick" Pielak'
        version: '7.0-1'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: cf1e03932847480fa563bdf3a8914a20
          name: 'Service status'
          type: SIMPLE
          key: 'net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"]'
          description: 'Checks if the indexer port is accepting TCP connections.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '10m'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: '18b7d08b54bd4566ac781efa50c21888'
              expression: 'last(/Wazuh indexer by HTTP/net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"])=0'
              name: 'Wazuh indexer: Service is down'
              priority: AVERAGE
              description: 'The indexer port is not accepting TCP connections.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: aef3e14b5752460f8817b6688e587232
          name: 'Service response time'
          type: SIMPLE
          key: 'net.tcp.service.perf["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"]'
          value_type: FLOAT
          units: s
          description: 'Checks the performance of the TCP service.'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: '9c6f3bac5caf44b7996f63b6bb6d1d91'
              expression: 'min(/Wazuh indexer by HTTP/net.tcp.service.perf["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"],5m)>{$WAZUH.INDEXER.RESPONSE_TIME.MAX.WARN}'
              name: 'Wazuh indexer: Service response time is too high'
              event_name: 'Wazuh indexer: Service response time is too high (over {$WAZUH.INDEXER.RESPONSE_TIME.MAX.WARN} for 5m)'
              priority: WARNING
              description: 'The TCP service of the indexer responds slowly.'
              manual_close: 'YES'
              dependencies:
                - name: 'Wazuh indexer: Service is down'
                  expression: 'last(/Wazuh indexer by HTTP/net.tcp.service["{$WAZUH.INDEXER.SCHEME}","{$WAZUH.INDEXER.HOST}","{$WAZUH.INDEXER.PORT}"])=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: fba7b72a2958444faf4693eedf541de4
          name: 'Get cluster health'
          type: HTTP_AGENT
          key: wazuh.indexer.cluster.get_health
          delay: '1m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_cluster/health?timeout=5s'
          description: 'Returns the health of the cluster.'
          tags:
            - tag: component
              value: raw
        - uuid: b638b79f6f83479385a470a891c3203d
          name: 'Get cluster settings'
          type: HTTP_AGENT
          key: wazuh.indexer.cluster.get_settings
          delay: '1h'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_cluster/settings?include_defaults=true&filter_path=*.cluster.max_shards_per_node,*.cluster.routing.allocation.disk.watermark'
          description: 'Returns the shard limit and the disk watermarks (transient, persistent and default values).'
          tags:
            - tag: component
              value: raw
        - uuid: '43b4e50379c44d85895b8262905045dc'
          name: 'Get nodes stats'
          type: HTTP_AGENT
          key: wazuh.indexer.nodes.get_stats
          delay: '1m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '30s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_nodes/stats/jvm,fs,os,process,thread_pool,breaker?filter_path=nodes.*.name,nodes.*.roles,nodes.*.jvm.mem.heap_used_percent,nodes.*.jvm.uptime_in_millis,nodes.*.fs.total,nodes.*.os.cpu.percent,nodes.*.process.open_file_descriptors,nodes.*.process.max_file_descriptors,nodes.*.thread_pool.write.rejected,nodes.*.thread_pool.search.rejected,nodes.*.breakers.parent.tripped'
          description: 'Returns statistics of all cluster nodes.'
          tags:
            - tag: component
              value: raw
        - uuid: '6b3b6d7e29ca4b2a8b3bc6b2a0997e85'
          name: 'Get nodes info'
          type: HTTP_AGENT
          key: wazuh.indexer.nodes.get_info
          delay: '1h'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/_nodes?filter_path=nodes.*.name,nodes.*.version'
          description: 'Returns the name and version of all cluster nodes.'
          tags:
            - tag: component
              value: raw
        - uuid: '5cd6220053904a1396edc369187b1c81'
          name: 'Get alerts ingest'
          type: HTTP_AGENT
          key: wazuh.indexer.alerts.get
          delay: '5m'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$WAZUH.INDEXER.USER}'
          password: '{$WAZUH.INDEXER.PASSWORD}'
          timeout: '15s'
          url: '{$WAZUH.INDEXER.SCHEME}://{$WAZUH.INDEXER.HOST}:{$WAZUH.INDEXER.PORT}/{$WAZUH.INDEXER.ALERTS.INDEX}/_search?size=0&filter_path=hits.total,aggregations'
          request_method: POST
          post_type: JSON
          posts: '{"track_total_hits":true,"query":{"range":{"timestamp":{"gte":"now-{$WAZUH.INDEXER.ALERTS.WINDOW}"}}},"aggs":{"last":{"max":{"field":"timestamp"}}}}'
          description: 'Counts the alerts indexed in the last {$WAZUH.INDEXER.ALERTS.WINDOW} and returns the newest alert timestamp.'
          tags:
            - tag: component
              value: raw
        - uuid: '5bd4f69763a044c09268fc925693c7a9'
          name: 'Cluster health status'
          type: DEPENDENT
          key: wazuh.indexer.cluster.status
          delay: '0'
          description: 'Health of the cluster: green - all shards are assigned, yellow - all primary shards are assigned but one or more replicas are not, red - one or more primary shards are not assigned.'
          valuemap:
            name: 'Wazuh indexer cluster state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.status'
            - type: JAVASCRIPT
              parameters:
                - |
                  var state = ['green', 'yellow', 'red'];

                  return state.indexOf(value.trim()) === -1 ? 255 : state.indexOf(value.trim());
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1h'
          master_item:
            key: wazuh.indexer.cluster.get_health
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: a5aee9c91fdb4015b9a1d60fbce43ede
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.cluster.status)=2'
              name: 'Wazuh indexer: Health is RED'
              priority: HIGH
              description: 'One or more primary shards are unassigned. Some data is unavailable and new alerts for the affected indices are not indexed.'
              tags:
                - tag: scope
                  value: availability
            - uuid: a5dba0c1139a45148a09738aa456a259
              expression: 'last(/Wazuh indexer by HTTP/wazuh.indexer.cluster.status)=1'
              name: 'Wazuh indexer: Health is YELLOW'
              priority: AVERAGE
