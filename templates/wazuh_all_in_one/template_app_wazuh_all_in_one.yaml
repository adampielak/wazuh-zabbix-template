              expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.disk.util[{#NODE.NAME}],5m)>last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.low) and last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.low)>0'
              name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage is over the low watermark'
              opdata: 'Used: {ITEM.LASTVALUE1}, watermark: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'OpenSearch no longer allocates new shards to the node.'
              dependencies:
                - name: 'Wazuh indexer: Node [{#NODE.NAME}]: Disk usage is over the high watermark'
                  expression: 'min(/Wazuh indexer by HTTP/wazuh.indexer.node.disk.util[{#NODE.NAME}],5m)>last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.high) and last(/Wazuh indexer by HTTP/wazuh.indexer.watermark.high)>0'
              tags:
