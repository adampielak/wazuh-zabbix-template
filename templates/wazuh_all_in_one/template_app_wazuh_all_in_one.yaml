        - uuid: b0c2d41b9a3d42a08ea23429b907c2f7
          name: 'Heap size limit'
          type: DEPENDENT
          key: wazuh.dashboard.heap.limit
          delay: '0'
          units: B
          description: 'Maximum Node.js heap size.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.metrics.process.memory.heap.size_limit'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.dashboard.get_status
          tags:
            - tag: component
              value: memory
        - uuid: '3e7b982f44a646d586722b5c61222a97'
          name: 'Heap usage'
          type: DEPENDENT
          key: wazuh.dashboard.heap.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Node.js heap in use, in % of the heap size limit.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.metrics.process.memory.heap'
            - type: JAVASCRIPT
              parameters:
                - |
                  var heap = JSON.parse(value);

                  return Math.round(heap.used_in_bytes / heap.size_limit * 10000) / 100;
          master_item:
            key: wazuh.dashboard.get_status
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: d01e75f0581e473cb4be81d1bf825e32
              expression: 'min(/Wazuh dashboard by HTTP/wazuh.dashboard.heap.util,15m)>{$WAZUH.DASHBOARD.HEAP.MAX.WARN}'
              name: 'Wazuh dashboard: Heap usage is high'
              event_name: 'Wazuh dashboard: Heap usage is high (over {$WAZUH.DASHBOARD.HEAP.MAX.WARN}% for 15m)'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The Node.js process is close to the heap size limit and can stop with an out of memory error.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: '55fd1f23523845b7ad650337a5092a3e'
          name: 'Event loop delay'
          type: DEPENDENT
          key: wazuh.dashboard.event_loop_delay
          delay: '0'
          value_type: FLOAT
          units: s
          description: 'Node.js event loop delay. A high delay makes the dashboard slow for every user.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.metrics.process.event_loop_delay'
            - type: MULTIPLIER
