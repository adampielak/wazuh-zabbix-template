        - uuid: b4e28aa67a90443eafaecd6eca821925
          name: 'Max shards per node'
          type: DEPENDENT
          key: wazuh.indexer.max_shards_per_node
          delay: '0'
          description: 'Effective value of cluster.max_shards_per_node.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.max_shards_per_node'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.max_shards_per_node is not set.';
                  }

                  return parseInt(value, 10);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: shards
        - uuid: '0d91e00b951f473fbcf0748614f8644e'
          name: 'Disk watermark low'
          type: DEPENDENT
          key: wazuh.indexer.watermark.low
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Effective value of cluster.routing.allocation.disk.watermark.low, in % of used disk space. -1 when the watermark is an absolute value. Above the low watermark OpenSearch stops allocating new shards to the node.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value),
                  	value = null;

                  ['transient', 'persistent', 'defaults'].some(function (scope) {
                  	var node = data[scope];

                  	'cluster.routing.allocation.disk.watermark.low'.split('.').forEach(function (key) {
                  		node = (node !== undefined && node !== null) ? node[key] : undefined;
                  	});
                  	if (node !== undefined && node !== null) {
                  		value = String(node);

                  		return true;
                  	}

                  	return false;
                  });

                  if (value === null) {
                  	throw 'Setting cluster.routing.allocation.disk.watermark.low is not set.';
                  }

                  // A watermark is a percentage ("85%"), a ratio ("0.85") or an absolute free space ("10gb").
                  // Absolute values are returned as -1: the disk triggers use only relative watermarks.
                  if (/^\d+(\.\d+)?%$/.test(value)) {
                  	return parseFloat(value);
                  }
                  if (/^0?\.\d+$|^1(\.0+)?$/.test(value)) {
                  	return parseFloat(value) * 100;
                  }

                  return -1;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'
          master_item:
            key: wazuh.indexer.cluster.get_settings
          tags:
            - tag: component
              value: storage
        - uuid: '29ef0dc4305140ac85bf4e15e8a5edf3'
          name: 'Disk watermark high'
          type: DEPENDENT
