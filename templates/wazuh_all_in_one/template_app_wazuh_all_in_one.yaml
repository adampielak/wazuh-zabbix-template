                  name: 'Wazuh indexer: Node [{#NODE.NAME}]: Write requests are rejected'
                  opdata: 'Rate: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The write thread pool queue is full and the node rejects indexing requests.'
                  tags:
