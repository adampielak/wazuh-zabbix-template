        - uuid: '49908d5b8f184d939a59dedd28f6e7f0'
          name: 'Alerts indexed'
          type: DEPENDENT
          key: wazuh.indexer.alerts.count
          delay: '0'
          description: 'Alerts indexed in the last {$WAZUH.INDEXER.ALERTS.WINDOW}.'
          preprocessing:
